apply plugin: 'com.android.application'

android {
    namespace 'ttc.project.stoku'
    compileSdk 35

    defaultConfig {
        applicationId "ttc.project.stoku"
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 6
        versionName "1.5"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary true
    }

    signingConfigs {
        release {
            def keystorePropsFile = rootProject.file('keystore.properties')
            if (keystorePropsFile.exists()) {
                def props = new Properties()
                props.load(new FileInputStream(keystorePropsFile))
                storeFile rootProject.file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def keystorePropsFile = rootProject.file('keystore.properties')
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // AndroidX core
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.loader:loader:1.1.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'

    // Material Components (replaces android.support.design.widget.*)
    implementation 'com.google.android.material:material:1.12.0'

    // Room (was android.arch.persistence.room)
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    androidTestImplementation 'androidx.room:room-testing:2.6.1'

    // Lifecycle (was android.arch.lifecycle) — 2.2.0 is the last version that still
    // ships ViewModelProviders, which the original 2018 source uses.
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    annotationProcessor 'androidx.lifecycle:lifecycle-compiler:2.2.0'

    // ButterKnife (10.x is AndroidX-compatible)
    implementation 'com.jakewharton:butterknife:10.2.3'
    annotationProcessor 'com.jakewharton:butterknife-compiler:10.2.3'

    // Third-party UI libs (kept on JitPack; rely on Jetifier for legacy support refs)
    implementation 'com.github.arcadefire:nice-spinner:1.4.4'
    implementation 'com.github.medyo:android-about-page:1.2.5'
    implementation 'com.github.deano2390:MaterialShowcaseView:1.3.7'
    implementation 'com.github.angads25:toggle:1.0.0'
    implementation 'com.github.ebanx:swipe-button:0.8.3'
    implementation 'com.davemorrissey.labs:subsampling-scale-image-view-androidx:3.10.0'
    implementation 'com.squareup.picasso:picasso:2.8'
    implementation 'com.airbnb.android:lottie:6.6.0'
    implementation 'org.jsoup:jsoup:1.17.2'

    // Google Play Services Ads (AdMob) — AndroidX-native since 19.x
    implementation 'com.google.android.gms:play-services-ads:23.6.0'

    // Stetho debug bridge
    implementation 'com.facebook.stetho:stetho:1.6.0'
    implementation 'com.facebook.stetho:stetho-okhttp:1.6.0'
}

apply plugin: 'com.google.gms.google-services'
